name: Firebase security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
        working-directory: security-tests
      - run: npm install -g firebase-tools@15.12.0
      - run: firebase emulators:exec --only firestore,storage --project demo-restaview-security "node --test security-tests/rules.test.cjs"
